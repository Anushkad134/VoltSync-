<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="VoltSync animated energy flow: Solar to Grid to Charger to EV" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#0F1E33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <g id="cube">
      <polygon points="-52,0 0,30 0,-20 -52,-50" fill="currentColor"/>
      <polygon points="-52,0 0,30 0,-20 -52,-50" fill="#000" opacity=".30"/>
      <polygon points="52,0 0,30 0,-20 52,-50" fill="currentColor"/>
      <polygon points="52,0 0,30 0,-20 52,-50" fill="#000" opacity=".52"/>
      <polygon points="0,-20 52,-50 0,-80 -52,-50" fill="currentColor"/>
      <polygon points="0,-20 52,-50 0,-80 -52,-50" fill="#fff" opacity=".20"/>
      <polygon points="0,-20 52,-50 0,-80 -52,-50" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1000" height="340" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="338" rx="21" fill="none" stroke="#38BDF8" stroke-opacity=".25"/>
  <ellipse cx="500" cy="200" rx="480" ry="120" fill="url(#glow)"/>

  <!-- perspective floor grid -->
  <g stroke="#38BDF8" stroke-opacity=".08" stroke-width="1">
    <line x1="0" y1="245" x2="1000" y2="245"/>
    <line x1="0" y1="258" x2="1000" y2="258"/>
    <line x1="0" y1="276" x2="1000" y2="276"/>
    <line x1="0" y1="300" x2="1000" y2="300"/>
    <line x1="0" y1="332" x2="1000" y2="332"/>
    <line x1="500" y1="232" x2="0" y2="340"/>
    <line x1="500" y1="232" x2="250" y2="340"/>
    <line x1="500" y1="232" x2="500" y2="340"/>
    <line x1="500" y1="232" x2="750" y2="340"/>
    <line x1="500" y1="232" x2="1000" y2="340"/>
  </g>

  <!-- title -->
  <text x="500" y="42" text-anchor="middle" fill="#38BDF8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="5">
    LIVE ENERGY FLOW  ·  DIGITAL TWIN
    <animate attributeName="opacity" values="1;.55;1" dur="2.4s" repeatCount="indefinite"/>
  </text>
  <circle cx="330" cy="37" r="4" fill="#22C55E">
    <animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- flow lines -->
  <g stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" fill="none">
    <line x1="192" y1="180" x2="338" y2="180" stroke="#22C55E"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="442" y1="180" x2="588" y2="180" stroke="#F59E0B"><animate attributeName="stroke-dashoffset" from="32" to="0" dur=".8s" repeatCount="indefinite"/></line>
    <line x1="692" y1="180" x2="838" y2="180" stroke="#38BDF8"><animate attributeName="stroke-dashoffset" from="32" to="0" dur=".7s" repeatCount="indefinite"/></line>
  </g>

  <!-- particles: solar -> grid -->
  <g fill="#BBF7D0" stroke="#22C55E" stroke-opacity=".45" stroke-width="7">
    <circle r="3.5"><animateMotion dur="2.1s" begin="0s" repeatCount="indefinite" path="M192,180 L338,180"/></circle>
    <circle r="3.5"><animateMotion dur="2.1s" begin=".7s" repeatCount="indefinite" path="M192,180 L338,180"/></circle>
    <circle r="3.5"><animateMotion dur="2.1s" begin="1.4s" repeatCount="indefinite" path="M192,180 L338,180"/></circle>
  </g>
  <!-- particles: grid -> charger -->
  <g fill="#FDE68A" stroke="#F59E0B" stroke-opacity=".45" stroke-width="7">
    <circle r="3.5"><animateMotion dur="1.8s" begin="0s" repeatCount="indefinite" path="M442,180 L588,180"/></circle>
    <circle r="3.5"><animateMotion dur="1.8s" begin=".6s" repeatCount="indefinite" path="M442,180 L588,180"/></circle>
    <circle r="3.5"><animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite" path="M442,180 L588,180"/></circle>
  </g>
  <!-- particles: charger -> EV -->
  <g fill="#E0F2FE" stroke="#38BDF8" stroke-opacity=".5" stroke-width="7">
    <circle r="3.5"><animateMotion dur="1.5s" begin="0s" repeatCount="indefinite" path="M692,180 L838,180"/></circle>
    <circle r="3.5"><animateMotion dur="1.5s" begin=".5s" repeatCount="indefinite" path="M692,180 L838,180"/></circle>
    <circle r="3.5"><animateMotion dur="1.5s" begin="1s" repeatCount="indefinite" path="M692,180 L838,180"/></circle>
  </g>

  <!-- shadows -->
  <g fill="#000" opacity=".38">
    <ellipse cx="140" cy="212" rx="64" ry="24"/>
    <ellipse cx="390" cy="212" rx="64" ry="24"/>
    <ellipse cx="640" cy="212" rx="64" ry="24"/>
    <ellipse cx="890" cy="212" rx="64" ry="24"/>
  </g>

  <!-- floating isometric nodes -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3s" begin="0s" repeatCount="indefinite"/>
    <use href="#cube" x="140" y="205" color="#22C55E"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3s" begin=".5s" repeatCount="indefinite"/>
    <use href="#cube" x="390" y="205" color="#F59E0B"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3s" begin="1s" repeatCount="indefinite"/>
    <use href="#cube" x="640" y="205" color="#38BDF8"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <use href="#cube" x="890" y="205" color="#A78BFA"/>
  </g>

  <!-- labels -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="140" y="268" fill="#F1F5F9" font-size="14" font-weight="700" letter-spacing="1.5">SOLAR ARRAY</text>
    <text x="140" y="288" fill="#22C55E" font-size="12">85% renewable</text>

    <text x="390" y="268" fill="#F1F5F9" font-size="14" font-weight="700" letter-spacing="1.5">REGIONAL GRID</text>
    <text x="390" y="288" fill="#F59E0B" font-size="12">feeder load shifting</text>

    <text x="640" y="268" fill="#F1F5F9" font-size="14" font-weight="700" letter-spacing="1.5">DC FAST CHARGER</text>
    <text x="640" y="288" fill="#38BDF8" font-size="12">50 kW smart draw</text>

    <text x="890" y="268" fill="#F1F5F9" font-size="14" font-weight="700" letter-spacing="1.5">EV BATTERY</text>
    <text x="890" y="288" fill="#A78BFA" font-size="12">charging to 80%</text>
  </g>

  <!-- battery bar -->
  <rect x="840" y="302" width="100" height="8" rx="4" fill="#1E293B"/>
  <rect x="840" y="302" width="0" height="8" rx="4" fill="#A78BFA">
    <animate attributeName="width" values="0;68;68;0" keyTimes="0;.6;.9;1" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
