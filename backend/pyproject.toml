[project]
name = "voltsync-backend"
version = "0.1.0"
description = "VoltSync Backend MVP"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pytest",
    "httpx",
    "pyjwt>=2.14.0",
    "cryptography>=50.0.1",
    "crewai",
    "twilio>=9.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
